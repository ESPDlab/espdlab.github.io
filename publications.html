<!doctype html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publication · ESPD Lab</title>
<meta name="description" content="ESPD 연구실의 학술지 논문, 학회 발표, 특허.">
<meta property="og:title" content="Publication · ESPD Lab">
<meta property="og:description" content="ESPD 연구실의 학술지 논문, 학회 발표, 특허.">
<meta property="og:image" content="https://espdlab.github.io/media/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&amp;family=Noto+Sans+KR:wght@300;400;600&amp;display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/bundle.css">
<link rel="stylesheet" href="css/site.css">
<style>
.yl-short{display:none}
@media (max-width:640px){.yl-full{display:none}.yl-short{display:inline}}
.ybar{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:var(--space-xs);margin:0;padding:0;border:0;background:none;font:inherit;cursor:pointer}
.ybar > span:first-child{display:block;width:min(28px,70%);background:var(--primary);border-radius:4px 4px 0 0}
</style>
<script src="js/site.js"></script>
</head>
<body>
<site-header></site-header>
<div class="lab-subnav">
<div class="lab-subnav-inner">
<p class="lab-subnav-title tagline">Publication</p>
<ul class="lab-subnav-links button-utility">
<li><a href="research.html">Research</a></li>
<li><a href="projects.html">Projects</a></li>
</ul>
<a class="lab-btn lab-btn-primary button-utility" href="contact.html"><span lang="ko">문의</span><span lang="en">Contact</span></a>
</div>
</div>

<main>
<section class="lab-tile" data-surface="canvas">
<h1 class="display-lg"><span lang="ko">논문</span><span lang="en">Publication</span></h1>
<p class="lab-tile-lead lead"><span lang="ko">학술지 논문, 학회 발표, 특허를 한곳에 모았습니다.</span><span lang="en">Journal papers, conference papers and patents in one place.</span></p>
</section>

<section data-surface="parchment" style="padding: var(--space-section) 0">
<div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-md); padding: 0 var(--space-lg)">
<label class="lab-search body" style="width: 100%; max-width: 480px">
<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.25"></circle><path d="M9.5 9.5L13 13"></path></svg>
<input id="pub-q" type="search" aria-label="Search publications">
</label>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-sm) var(--space-xl)">
<div role="group" aria-label="Region" style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm)">
<button class="lab-chip caption" type="button" aria-pressed="true" data-key="region" data-val="all"><span lang="ko">국내외 전체</span><span lang="en">All regions</span></button>
<button class="lab-chip caption" type="button" aria-pressed="false" data-key="region" data-val="intl"><span lang="ko">국외</span><span lang="en">International</span> <span class="lab-muted" data-n="intl"></span></button>
<button class="lab-chip caption" type="button" aria-pressed="false" data-key="region" data-val="dom"><span lang="ko">국내</span><span lang="en">Domestic</span> <span class="lab-muted" data-n="dom"></span></button>
</div>
<div role="group" aria-label="Type" style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm)">
<button class="lab-chip caption" type="button" aria-pressed="true" data-key="kind" data-val="all"><span lang="ko">종류 전체</span><span lang="en">All types</span></button>
<button class="lab-chip caption" type="button" aria-pressed="false" data-key="kind" data-val="journal"><span lang="ko">저널</span><span lang="en">Journal</span> <span class="lab-muted" data-n="journal"></span></button>
<button class="lab-chip caption" type="button" aria-pressed="false" data-key="kind" data-val="conf"><span lang="ko">학회</span><span lang="en">Conference</span> <span class="lab-muted" data-n="conf"></span></button>
<button class="lab-chip caption" type="button" aria-pressed="false" data-key="kind" data-val="patent"><span lang="ko">특허</span><span lang="en">Patent</span> <span class="lab-muted" data-n="patent"></span></button>
</div>
</div>
</div>

<div class="lab-card" style="max-width: var(--content-text); margin: var(--space-lg) auto 0; width: calc(100% - 2 * var(--space-lg))">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-xs) var(--space-lg)">
<div>
<p id="pub-chart-label" class="caption-strong lab-muted" style="margin: 0"></p>
<p id="pub-chart-value" class="display-lg" style="margin: var(--space-xxs) 0 0"></p>
</div>
<button id="pub-clear" class="lab-btn lab-btn-pearl caption" type="button" hidden><span lang="ko">전체 연도 보기</span><span lang="en">Show all years</span></button>
</div>
<div id="pub-chart" role="group" aria-label="Publications per year" style="display: flex; align-items: stretch; gap: 2px; height: 190px; margin-top: var(--space-lg)"></div>
</div>

<p class="caption lab-muted" style="margin: var(--space-lg) 0 0; padding: 0 var(--space-lg); text-align: center"><span id="pub-result"></span> · <span lang="ko">¹ 제1저자, * 교신저자, 굵은 글씨는 연구실 구성원</span><span lang="en">¹ first author, * corresponding author, lab members in bold</span></p>

<div class="lab-grid eq" id="pub-list" style="grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); padding-top: var(--space-md)"></div>
<p id="pub-empty" class="body lab-muted" style="margin: 0; padding: var(--space-lg); text-align: center" hidden><span lang="ko">조건에 맞는 실적이 없습니다.</span><span lang="en">Nothing matches these filters.</span></p>
</section>
</main>
<site-footer></site-footer>
</body>
</html>
